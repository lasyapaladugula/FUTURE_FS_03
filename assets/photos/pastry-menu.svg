<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pastryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff9f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff0db;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="muffin" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f4d9b8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#e8c8a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a876;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#pastryBg)"/>
  
  <!-- Muffin wrapper -->
  <ellipse cx="200" cy="160" rx="80" ry="50" fill="#f5deb3" stroke="#d4a574" stroke-width="2"/>
  <path d="M 140 160 Q 140 120 200 100 Q 260 120 260 160" fill="url(#muffin)" stroke="#c9a876" stroke-width="2"/>
  
  <!-- Muffin top texture -->
  <circle cx="160" cy="130" r="8" fill="#d4a574" opacity="0.5"/>
  <circle cx="200" cy="115" r="6" fill="#d4a574" opacity="0.5"/>
  <circle cx="240" cy="125" r="7" fill="#d4a574" opacity="0.5"/>
  
  <!-- Blueberries -->
  <circle cx="170" cy="145" r="6" fill="#4169e1"/>
  <circle cx="210" cy="138" r="5" fill="#4169e1"/>
  <circle cx="240" cy="150" r="6" fill="#4169e1"/>
  <circle cx="185" cy="155" r="5" fill="#4169e1"/>
  
  <!-- Plate -->
  <ellipse cx="200" cy="220" rx="100" ry="35" fill="#fff8dc" stroke="#daa520" stroke-width="2"/>
  <ellipse cx="200" cy="218" rx="95" ry="30" fill="#fffacd" opacity="0.6"/>
  
  <!-- Decorative text -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#d16013">Blueberry Muffin</text>
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7b5a3c">₹80</text>
</svg>
