<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coffeeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff9f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe4c4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5deb3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#coffeeBg)"/>
  
  <!-- Coffee cup -->
  <ellipse cx="200" cy="120" rx="60" ry="80" fill="url(#cupGrad)" stroke="#d4a574" stroke-width="2"/>
  <ellipse cx="200" cy="120" rx="55" ry="75" fill="#f5e6d3" opacity="0.6"/>
  
  <!-- Coffee inside -->
  <ellipse cx="200" cy="140" rx="50" ry="50" fill="#6f4e37" opacity="0.8"/>
  <ellipse cx="200" cy="135" rx="48" ry="12" fill="#8b6f47" opacity="0.6"/>
  
  <!-- Handle -->
  <path d="M 270 100 Q 310 120 300 160" stroke="#d4a574" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Saucer -->
  <ellipse cx="200" cy="210" rx="90" ry="30" fill="#f5deb3" stroke="#d4a574" stroke-width="2"/>
  <ellipse cx="200" cy="208" rx="85" ry="25" fill="#fff8dc" opacity="0.5"/>
  
  <!-- Decorative text -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#d16013">Espresso</text>
  <text x="200" y="275" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7b5a3c">₹120</text>
</svg>
