<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Sunny Roast Cafe</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <img src="assets/logo.svg" alt="Sunny Roast Cafe logo" style="height:40px" />
        <h1 class="logo">Sunny Roast Cafe</h1>
      </div>
      <button class="nav-toggle" aria-expanded="false" aria-controls="siteNav" type="button">
        <span class="sr-only">Toggle navigation</span>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 7H20M4 12H20M4 17H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <nav id="siteNav" class="nav">
        <a href="index.html">Home</a>
        <a href="signup.html">Sign Up</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="auth">
      <h2>Login to your account</h2>
      <form id="loginForm" class="auth-form">
        <label>Email<input type="email" name="email" required></label>
        <label>Password<input type="password" name="password" required></label>
        <button type="submit" class="btn">Login</button>
      </form>
      <p>Don't have an account? <a href="signup.html">Sign up</a></p>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
