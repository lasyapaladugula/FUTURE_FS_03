<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard — Sunny Roast Cafe</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <img src="assets/logo.svg" alt="Sunny Roast Cafe logo" style="height:40px" />
        <h1 class="logo">Sunny Roast Cafe</h1>
      </div>
      <button class="nav-toggle" aria-expanded="false" aria-controls="siteNav" type="button">
        <span class="sr-only">Toggle navigation</span>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 7H20M4 12H20M4 17H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <nav id="siteNav" class="nav">
        <a href="index.html">Home</a>
        <a href="#" id="logoutLink">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="dashboard">
      <h2>Welcome, <span id="userName">Guest</span></h2>
      <p class="muted">This is a demo dashboard. From here you can review your profile and preview reservation activity.</p>
      <div id="dashboardContent"></div>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
